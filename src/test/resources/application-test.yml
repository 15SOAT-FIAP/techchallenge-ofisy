spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ofisydb_test
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  config:
    import: optional:file:.env[.properties]