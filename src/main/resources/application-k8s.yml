spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/ofisydb
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
security:
  public-paths:
    - /api/v1/login
    - /api/v1/service-orders/*/status
    - /api/v1/service-orders/quote/*/approve
    - /api/v1/service-orders/quote/*/reprove
    - /api/v1/notifications/service-orders
    - /api/v1/notifications/service-orders/*
    - /api/v1/notifications/service-orders/*/read
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
    - /actuator/health/**
management:
  endpoint:
    health:
      probes:
        enabled: true