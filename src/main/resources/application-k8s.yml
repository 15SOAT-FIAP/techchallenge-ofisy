spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
security:
  public-paths:
    - /api/v1/login
    - /api/v1/service-orders/*/status
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
    - /actuator/health/**
management:
  endpoint:
    health:
      probes:
        enabled: true
server:
  forward-headers-strategy: framework