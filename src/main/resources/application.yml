spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/ofisydb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  docker:
    compose:
      file: compose.db.yaml
  config:
    import: optional:file:.env[.properties]
  cloud:
    aws:
      region:
        static: us-east-1
      sqs:
        queue-not-found-strategy: fail
ofisy:
  messaging:
    queues:
      service-order: ofisy-service-order.fifo
    topics:
      service-order: ofisy-service-order-events.fifo
    outbox:
      publish-interval: 1s
      batch-size: 100
management:
    endpoints:
      web:
        exposure:
          include: health
    datadog:
      metrics:
        export:
          enabled: ${DD_METRICS_ENABLED:false}
          api-key: ${DD_API_KEY:}
          uri: ${DD_METRICS_URI:https://api.us5.datadoghq.com}
          step: 30s
security:
  public-paths:
    - /api/v1/login
    - /api/v1/service-orders/*/status
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**

logging:
  level:
    org.flywaydb: DEBUG
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
