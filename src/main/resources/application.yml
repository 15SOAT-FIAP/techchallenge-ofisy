spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/ofisydb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  docker:
    compose:
      file: compose.db.yaml
management:
    endpoints:
      web:
        exposure:
          include: health
security:
  public-paths:
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**

logging:
  level:
    org.flywaydb: DEBUG