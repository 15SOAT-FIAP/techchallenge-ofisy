spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/ofisydb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
management:
    endpoints:
      web:
        exposure:
          include: health
security:
  public-paths:
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
