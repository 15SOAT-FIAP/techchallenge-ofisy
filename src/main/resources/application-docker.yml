spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/ofisydb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
security:
  public-paths:
    - /api/v1/login
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000