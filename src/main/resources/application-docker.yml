spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/ofisydb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
management:
  endpoints:
    web:
      exposure:
        include: health
security:
  public-paths:
    - /api/v1/login
    - /api/v1/customers
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
logging:
  level:
    org.flywaydb: DEBUG
jwt:
  adminPassword: ${ADMIN_PASSWORD}
  adminLogin: ${ADMIN_LOGIN}
  secret: ${JWT_SECRET}
  expiration: 86400000