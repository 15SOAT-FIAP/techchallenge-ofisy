name: 🚀 Deploy Automático na AWS (CD)

on:
  push:
    branches:
      - master

jobs:
  deploy-to-aws:
    name: ☁️ Deploy Automático na AWS (EKS & RDS)
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY

    steps:
      - name: 🔍 Checkout do código
        uses: actions/checkout@v4

      # 1. Configurar Credenciais da AWS a partir dos Secrets do GitHub
      - name: 🔐 Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 2. Configurar Java 21 para compilar a aplicação
      - name: ☕ Configurar JDK 21 (Java)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Configurar Terraform
      - name: 🛠️ Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # 4. Criar Bucket S3 (Terraform Bootstrap)
      - name: 🏗️ Terraform Bootstrap (S3 Bucket)
        run: |
          cd infra/bootstrap
          echo 'account_id = "${{ secrets.AWS_ACCOUNT_ID }}"' > terraform.tfvars
          terraform init
          
          # Se o bucket já existir, importa ele para o estado para evitar erro de criação duplicada
          aws s3api head-bucket --bucket "ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" 2>/dev/null && \
          terraform import aws_s3_bucket.tfstate ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }} || echo "Bucket nao existe, sera criado."
          
          terraform apply -auto-approve

      # 5. Inicializar o Terraform e Executar o Plan
      - name: 🔍 Terraform Plan
        run: |
          cd infra
          
          # Busca dinamicamente os nomes das roles que mudam a cada reinício do AWS Academy
          EKS_CLUSTER_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'LabEksClusterRole')].RoleName" --output text)
          EKS_NODE_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'LabEksNodeRole')].RoleName" --output text)
          
          # Cria o arquivo terraform.tfvars com os dados da AWS Academy
          echo 'account_id = "${{ secrets.AWS_ACCOUNT_ID }}"' > terraform.tfvars
          echo 'role_name  = "LabRole"' >> terraform.tfvars
          echo 'db_password = "${{ secrets.DB_PASSWORD }}"' >> terraform.tfvars
          echo "eks_cluster_role = \"$EKS_CLUSTER_ROLE\"" >> terraform.tfvars
          echo "eks_node_role = \"$EKS_NODE_ROLE\"" >> terraform.tfvars
          
          # Cria o arquivo backend.hcl apontando para o bucket do tfstate
          echo 'bucket = "ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"' > backend.hcl
          
          terraform init -backend-config=backend.hcl
          
          # Executa o plan e salva o output para o sumário do GitHub Actions (Job Summary)
          terraform plan -no-color > plan.txt
          cat plan.txt
          
          echo "### 🔍 Planejamento de Alterações do Terraform (Plan)" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # 6. Executar o Terraform Apply
      - name: 🏗️ Provisionar Infraestrutura (Terraform Apply)
        run: |
          cd infra
          terraform apply -auto-approve
          
          # Captura o endereço (hostname) do RDS gerado e salva em uma variável de ambiente global
          RDS_ENDPOINT=$(terraform output -raw rds_address)
          echo "RDS_HOST=$RDS_ENDPOINT" >> $GITHUB_ENV

      # 7. Conectar kubectl no Cluster EKS
      - name: ☸️ Conectar ao EKS Cluster
        run: |
          aws eks update-kubeconfig --region us-east-1 --name ofisy-cluster

      # 8. Autenticar Docker no ECR
      - name: 🔐 Login no Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      # 9. Compilar o projeto e gerar o JAR
      - name: ☕ Compilar Projeto (Maven)
        run: |
          mvn clean package -DskipTests
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 10. Buildar e Push da imagem Docker para o ECR da AWS
      - name: 📤 Enviar Imagem para o ECR
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ofisy-ecr:${{ env.IMAGE_TAG }} .
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ofisy-ecr:${{ env.IMAGE_TAG }}

      # 11. Atualizar placeholders e aplicar no cluster EKS da AWS
      - name: 🚀 Deploy dos Manifestos no EKS
        run: |
          # Codifica as chaves do GitHub Secrets em base64 dinamicamente (sem quebra de linha)
          BASE64_USER=$(echo -n "ofisy" | base64 -w 0)
          BASE64_PASS=$(echo -n "${{ secrets.DB_PASSWORD }}" | base64 -w 0)
          BASE64_JWT=$(echo -n "${{ secrets.JWT_SECRET }}" | base64 -w 0)

          # Substitui placeholders no secret da aplicação com credenciais base64
          sed -i "s|<BASE64_USERNAME>|$BASE64_USER|g" k8s/secret.yml
          sed -i "s|<BASE64_PASSWORD>|$BASE64_PASS|g" k8s/secret.yml
          sed -i "s|<BASE64_JWT_SECRET>|$BASE64_JWT|g" k8s/secret.yml
          
          # Injeta o host do banco de dados (RDS) no ConfigMap
          sed -i "s|<RDS_ADDRESS>|$RDS_HOST|g" k8s/configmap.yml
          
          # Injeta a imagem do ECR no Deployment
          sed -i "s|<ECR_REPOSITORY_URL>:<IMAGE_TAG>|${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ofisy-ecr:${{ env.IMAGE_TAG }}|g" k8s/deployment.yml
          
          # Aplica os recursos no cluster EKS
          kubectl apply -f k8s/secret.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/hpa.yml
          
          # Aguarda a inicialização com o timeout seguro de 300 segundos
          kubectl rollout status deployment/ofisy-deployment --timeout=300s

          # Loop para aguardar o DNS do Load Balancer estar disponível
          echo "⏳ Aguardando DNS do Load Balancer estar disponível..."
          EXTERNAL_IP=""
          for i in {1..30}; do
            EXTERNAL_IP=$(kubectl get svc ofisy-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$EXTERNAL_IP" ]; then
              echo "✅ Load Balancer DNS obtido: $EXTERNAL_IP"
              break
            fi
            echo "Aguardando 10 segundos (tentativa $i de 30)..."
            sleep 10
          done

          if [ -n "$EXTERNAL_IP" ]; then
            SWAGGER_URL="http://$EXTERNAL_IP:8080/swagger-ui/index.html#/"
            echo "🚀 Aplicação rodando em: $SWAGGER_URL"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🌐 Link de Acesso da Aplicação (Swagger UI)" >> $GITHUB_STEP_SUMMARY
            echo "Acesse a API implantada na AWS:" >> $GITHUB_STEP_SUMMARY
            echo "- 🔗 **[Clique aqui para abrir o Swagger UI]($SWAGGER_URL)**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Não foi possível obter o DNS do Load Balancer a tempo." >> $GITHUB_STEP_SUMMARY
          fi
