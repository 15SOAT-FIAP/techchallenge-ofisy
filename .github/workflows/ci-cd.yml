name: 🚀 Deploy Automático na AWS (CD)

on:
  push:
    branches:
      - master

jobs:
  deploy-to-aws:
    name: ☁️ Deploy Automático na AWS (EKS & RDS)
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY

    steps:
      - name: 🔍 Checkout do código
        uses: actions/checkout@v4

      # 1. Configurar Credenciais da AWS a partir dos Secrets do GitHub
      - name: 🔐 Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 2. Configurar Java 21 para compilar a aplicação
      - name: ☕ Configurar JDK 21 (Java)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Configurar Terraform
      - name: 🛠️ Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # 4. Inicializar o Terraform e Executar o Plan
      - name: 🔍 Terraform Plan
        run: |
          # Garante que o bucket do S3 para o Terraform State existe
          aws s3api head-bucket --bucket "ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" 2>/dev/null || \
          aws s3 mb "s3://ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" --region us-east-1
          
          cd infra/terraform
          
          # Cria o arquivo terraform.tfvars com os dados da AWS Academy
          echo 'account_id = "${{ secrets.AWS_ACCOUNT_ID }}"' > terraform.tfvars
          echo 'role_name  = "LabRole"' >> terraform.tfvars
          
          # Cria o arquivo backend.hcl apontando para o bucket do tfstate
          echo 'bucket = "ofisy-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"' > backend.hcl
          
          terraform init -backend-config=backend.hcl
          terraform plan

      # 5. Executar o Terraform Apply
      - name: 🏗️ Provisionar Infraestrutura (Terraform Apply)
        run: |
          cd infra/terraform
          terraform apply -auto-approve
          
          # Captura o endereço (hostname) do RDS gerado e salva em uma variável de ambiente global
          RDS_ENDPOINT=$(terraform output -raw rds_address)
          echo "RDS_HOST=$RDS_ENDPOINT" >> $GITHUB_ENV

      # 6. Conectar kubectl no Cluster EKS
      - name: ☸️ Conectar ao EKS Cluster
        run: |
          aws eks update-kubeconfig --region us-east-1 --name ofisy-cluster

      # 7. Autenticar Docker no ECR
      - name: 🔐 Login no Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      # 8. Compilar o projeto e gerar o JAR
      - name: ☕ Compilar Projeto (Maven)
        run: |
          mvn clean package -DskipTests

      # 9. Buildar e Push da imagem Docker para o ECR da AWS
      - name: 📤 Enviar Imagem para o ECR
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ofisy-ecr:latest .
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ofisy-ecr:latest

      # 10. Atualizar placeholders e aplicar no cluster EKS da AWS
      - name: 🚀 Deploy dos Manifestos no EKS
        run: |
          # Substitui placeholders no secret da aplicação com credenciais base64
          sed -i "s|<BASE64_USERNAME>|b2Zpc3lfdXNlcg==|g" k8s/secret.yml
          sed -i "s|<BASE64_PASSWORD>|b2Zpc3lfcGFzcw==|g" k8s/secret.yml
          sed -i "s|<BASE64_JWT_SECRET>|c3VwZXJfc2VjcmV0X2xvY2FsX2p3dF90b2tlbl9mb3Jfb2Zpc3lfYXBwX2Zhc2VfMg==|g" k8s/secret.yml
          
          # Injeta o host do banco de dados (RDS) no ConfigMap
          sed -i "s|<RDS_ADDRESS>|$RDS_HOST|g" k8s/configmap.yml
          
          # Injeta a imagem do ECR no Deployment
          sed -i "s|<ECR_REPOSITORY_URL>:<IMAGE_TAG>|${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ofisy-ecr:latest|g" k8s/deployment.yml
          
          # Aplica os recursos no cluster EKS
          kubectl apply -f k8s/secret.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/hpa.yml
          
          # Aguarda a inicialização com o timeout seguro de 150 segundos
          kubectl rollout status deployment/ofisy-deployment --timeout=150s
