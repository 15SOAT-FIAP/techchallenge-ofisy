name: Deploy Automático na AWS (CD)

on:
  workflow_run:
    workflows: ["Build & Test (CI)"]
    branches: [master]
    types:
      - completed

jobs:
  deploy-to-aws:
    name: Deploy Automático na AWS (Kubernetes EKS)
    runs-on: ubuntu-latest
    environment: AWS_ACADEMY
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 1. Configurar Credenciais da AWS a partir dos Secrets do GitHub
      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 2. Configurar Java 21 para compilar a aplicação
      - name: Configurar JDK 21 (Java)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Obter o Endereço do Banco de Dados RDS PostgreSQL
      - name: Obter Endereço do RDS (PostgreSQL)
        run: |
          RDS_ENDPOINT=$(aws rds describe-db-instances --query "DBInstances[?Engine=='postgres'].Endpoint.Address" --output text | head -n 1)
          if [ -z "$RDS_ENDPOINT" ] || [ "$RDS_ENDPOINT" == "None" ]; then
            echo "RDS não retornado dinamicamente. Utilizando secret RDS_HOST se disponível."
            RDS_ENDPOINT="${{ secrets.RDS_HOST }}"
          fi
          echo "RDS_HOST=$RDS_ENDPOINT" >> $GITHUB_ENV
          echo "RDS Host configurado: $RDS_ENDPOINT"

      # 4. Conectar kubectl no Cluster EKS
      - name: Conectar ao EKS Cluster
        run: |
          aws eks update-kubeconfig --region us-east-1 --name ofisy-cluster

      # 5. Garantir que o Metrics Server está instalado (necessário para o HPA calcular CPU/memória)
      - name: Instalar/Atualizar Metrics Server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

          # EKS usa certificado autoassinado no kubelet, então o metrics-server precisa dessa flag para coletar métricas
          kubectl patch deployment metrics-server -n kube-system --type='json' \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]' \
            || true

          kubectl rollout status deployment/metrics-server -n kube-system --timeout=120s

      # 6. Autenticar Docker no ECR
      - name: Login no Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      # 7. Compilar o projeto e gerar o JAR
      - name: Compilar Projeto (Maven)
        run: |
          mvn clean package -DskipTests
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 8. Buildar e Push da imagem Docker para o ECR da AWS
      - name: Enviar Imagem para o ECR
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ofisy-ecr:${{ env.IMAGE_TAG }} .
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ofisy-ecr:${{ env.IMAGE_TAG }}

      # 9. Atualizar placeholders e aplicar no cluster EKS da AWS
      - name: Deploy dos Manifestos no EKS
        run: |
          # Codifica as chaves do GitHub Secrets em base64 dinamicamente (sem quebra de linha)
          BASE64_USER=$(echo -n "ofisy" | base64 -w 0)
          BASE64_PASS=$(echo -n "${{ secrets.DB_PASSWORD }}" | base64 -w 0)
          BASE64_JWT=$(echo -n "${{ secrets.JWT_SECRET }}" | base64 -w 0)

          # Substitui placeholders no secret da aplicação com credenciais base64
          sed -i "s|<BASE64_USERNAME>|$BASE64_USER|g" k8s/secret.yml
          sed -i "s|<BASE64_PASSWORD>|$BASE64_PASS|g" k8s/secret.yml
          sed -i "s|<BASE64_JWT_SECRET>|$BASE64_JWT|g" k8s/secret.yml
          
          # Injeta o host do banco de dados (RDS) no ConfigMap
          sed -i "s|<RDS_ADDRESS>|$RDS_HOST|g" k8s/configmap.yml
          
          # Injeta a imagem do ECR no Deployment
          sed -i "s|<ECR_REPOSITORY_URL>:<IMAGE_TAG>|${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/ofisy-ecr:${{ env.IMAGE_TAG }}|g" k8s/deployment.yml
          
          # Aplica os recursos no cluster EKS
          kubectl apply -f k8s/secret.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/hpa.yml
          
          # Aguarda a inicialização com o timeout seguro de 300 segundos
          kubectl rollout status deployment/ofisy-deployment --timeout=300s

          # Loop para aguardar o DNS do Load Balancer estar disponível
          echo "Aguardando DNS do Load Balancer estar disponível..."
          EXTERNAL_IP=""
          for i in {1..30}; do
            EXTERNAL_IP=$(kubectl get svc ofisy-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$EXTERNAL_IP" ]; then
              echo "Load Balancer DNS obtido: $EXTERNAL_IP"
              break
            fi
            echo "Aguardando 10 segundos (tentativa $i de 30)..."
            sleep 10
          done

          if [ -n "$EXTERNAL_IP" ]; then
            API_URL="http://$EXTERNAL_IP:8080"
            SWAGGER_URL="$API_URL/swagger-ui/index.html#/"
            echo "Aplicação rodando em: $API_URL"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Deploy concluído" >> $GITHUB_STEP_SUMMARY
            echo "- API: $API_URL" >> $GITHUB_STEP_SUMMARY
            echo "- Swagger UI: $SWAGGER_URL" >> $GITHUB_STEP_SUMMARY
          else
            echo "Não foi possível obter o DNS do Load Balancer a tempo." >> $GITHUB_STEP_SUMMARY
          fi

