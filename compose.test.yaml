services:
  postgres-test:
    image: postgres:16
    container_name: postgres-test-db
    environment:
      POSTGRES_DB: ofisydb_test
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ofisydb_test -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10